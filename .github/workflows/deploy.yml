name: Build, Test & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    container: lorisleiva/laravel-docker:8.5
    outputs:
      version: ${{ github.ref == 'refs/heads/main' && steps.version.outputs.new_tag || steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          default_bump: minor
          dry_run: true
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: npm ci
      - run: composer install --no-interaction --no-dev --prefer-dist
      - run: php artisan images:resize
      - run: npm run build
      - run: touch database/database.sqlite
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate
      - run: php artisan test --log-junit ./junit.xml
      # Production build smoke test. Must run after the tests: a cached config ignores APP_ENV=testing and CSRF would be enforced.
      - run: php artisan optimize --env=production
        if: github.ref == 'refs/heads/main'
      - run: php artisan event:cache
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: junit.xml
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            vendor
            public/build
            resources/img/sizes
          include-hidden-files: true

  deploy:
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
    needs: build_and_test
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1 # staging first; a failure there skips production
      matrix:
        domain:
          - ${{ vars.STAGING_DOMAIN }}
          - ${{ vars.PROD_DOMAIN }}
        exclude:
          - domain: ${{ github.event_name == 'pull_request' && vars.PROD_DOMAIN || '' }}
    concurrency: deploy-${{ matrix.domain }}
    environment:
      name: ${{ matrix.domain == vars.PROD_DOMAIN && 'production' || 'staging' }}
      url: https://${{ matrix.domain }}
    env:
      SSH: ssh -i ~/.ssh/deploy -p ${{ vars.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no
      HOST: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
      - run: rsync -rltz --delete -e "$SSH" vendor public/build resources/img/sizes --relative "$HOST:domains/${{ matrix.domain }}/"
      - run: |
          $SSH $HOST bash -es <<'EOF'
            set -e
            cd domains/${{ matrix.domain }}
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/${{ vars.DEPLOY_GIT_KEY }} -o IdentitiesOnly=yes"
            git fetch --tags --force origin ${{ github.sha }}
            git reset --hard FETCH_HEAD
            echo '${{ needs.build_and_test.outputs.version }}' > VERSION
            rm -f bootstrap/cache/*.php
            php artisan down
            trap 'php artisan up' EXIT
            php artisan migrate --force
            php artisan optimize
            php artisan event:cache
            php artisan queue:restart
          EOF
      - name: Warm Cloudflare cache
        run: |
          for f in public/build/assets/* $($SSH $HOST "cd domains/${{ matrix.domain }} && find public/storage/blog-media -type f"); do
            curl -fsS --retry 2 -o /dev/null -w '%{http_code} %header{cf-cache-status} %{url}\n' "https://${{ matrix.domain }}/${f#public/}"
          done
