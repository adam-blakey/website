name: Build, Test & Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container: lorisleiva/laravel-docker:8.5
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm install vite
      - run: npm run build
      - run: composer install --no-interaction --no-dev --prefer-dist
      - run: touch database/database.sqlite
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate
      - run: php artisan test --log-junit ./junit.xml
      # Production build smoke test. Must run after the tests: a cached config ignores APP_ENV=testing and CSRF would be enforced.
      - run: php artisan optimize --env=production
      - run: php artisan event:cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            vendor
            public/build
          include-hidden-files: true

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: composer global require --prefer-dist laravel/envoy=~2.9.0 --no-interaction --prefer-dist --quiet
      - run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github
          chmod 600 ~/.ssh/github
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/github
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      - run: rsync -rltz --delete -e "ssh -p $DEPLOY_SSH_PORT" vendor public/build --relative "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:domains/laravel.blakey.family/"
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      - run: composer global exec envoy -- run deploy --branch=main --domain=laravel.blakey.family
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}

  deploy_main:
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: composer global require --prefer-dist laravel/envoy=~2.9.0 --no-interaction --prefer-dist --quiet
      - run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github
          chmod 600 ~/.ssh/github
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/github
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      - run: rsync -rltz --delete -e "ssh -p $DEPLOY_SSH_PORT" vendor public/build --relative "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:domains/adam.blakey.family/"
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      - run: composer global exec envoy -- run deploy --branch=main --domain=adam.blakey.family
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
