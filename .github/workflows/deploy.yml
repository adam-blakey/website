name: Build, Test & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container: lorisleiva/laravel-docker:8.5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: npm ci
      - run: npm run build
      - run: composer install --no-interaction --no-dev --prefer-dist
      - run: touch database/database.sqlite
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate
      - run: php artisan test --log-junit ./junit.xml
      # Production build smoke test. Must run after the tests: a cached config ignores APP_ENV=testing and CSRF would be enforced.
      - run: php artisan optimize --env=production
        if: github.ref == 'refs/heads/main'
      - run: php artisan event:cache
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit
          path: junit.xml
      - uses: actions/upload-artifact@v5
        with:
          name: build
          path: |
            vendor
            public/build
          include-hidden-files: true

  release:
    if: github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release # serialise so two pushes can't compute the same version
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Patch bump of the latest vX.Y.Z tag (v0.0.1 if none). For a minor/major bump, push the tag by hand.
      - id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          echo "next=$(echo "${last:-v0.0.0}" | awk -F. '{print $1"."$2"."$3+1}')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  deploy:
    if: ${{ !failure() && !cancelled() && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
    needs: [build_and_test, release]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # staging first; a failure there skips production
      matrix:
        domain:
          - ${{ vars.STAGING_DOMAIN }}
          - ${{ vars.PROD_DOMAIN }}
        exclude:
          - domain: ${{ github.event_name == 'pull_request' && vars.PROD_DOMAIN || '' }}
    concurrency: deploy-${{ matrix.domain }}
    env:
      SSH: ssh -i ~/.ssh/deploy -p ${{ vars.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no
      HOST: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: build
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
      - run: rsync -rltz --delete -e "$SSH" vendor public/build --relative "$HOST:domains/${{ matrix.domain }}/"
      - run: |
          $SSH $HOST bash -es <<'EOF'
            set -e
            cd domains/${{ matrix.domain }}
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/${{ vars.DEPLOY_GIT_KEY }} -o IdentitiesOnly=yes"
            git fetch --tags --force origin ${{ github.sha }}
            git reset --hard FETCH_HEAD
            git describe --tags --abbrev=0 --always > VERSION
            rm -f bootstrap/cache/*.php
            php artisan down
            trap 'php artisan up' EXIT
            php artisan migrate --force
            php artisan optimize
            php artisan event:cache
            php artisan queue:restart
          EOF
      - name: Warm Cloudflare cache
        run: |
          for f in public/build/assets/* $($SSH $HOST "cd domains/${{ matrix.domain }} && find public/storage/blog-media -type f"); do
            curl -fsS --retry 2 -o /dev/null -w '%{http_code} %header{cf-cache-status} %{url}\n' "https://${{ matrix.domain }}/${f#public/}"
          done
