name: Run Checks From PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  dispatch_checks:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/checks')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - run: |
          read -r branch sha <<< "$(gh pr view "$PR_NUMBER" --json headRefName,headRefOid --jq '.headRefName + " " + .headRefOid')"
          gh workflow run deploy.yml --ref "$branch"
          gh run list --commit "$sha" --json databaseId,workflowName \
            --jq 'map(select(.workflowName != "Build, Test & Deploy")) | group_by(.workflowName) | map(max_by(.databaseId).databaseId) | .[]' \
            | xargs -rn1 gh run rerun
