name: Run Checks From PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  dispatch_checks:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/checks')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - run: gh workflow run deploy.yml --ref "$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
