name: Release

on:
  schedule:
    - cron: '30 7 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency: ${{ github.workflow }}

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - id: deployed
        run: echo "sha=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')" >> "$GITHUB_OUTPUT"
      - id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          default_bump: minor
          commit_sha: ${{ steps.deployed.outputs.sha }}
      - if: steps.tag.outputs.new_tag
        run: gh release create "${{ steps.tag.outputs.new_tag }}" --verify-tag --generate-notes
