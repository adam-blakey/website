image: lorisleiva/laravel-docker:8.3

stages:
  - build
  - test
  #- tag
  - deploy

build:
  stage: build
  script:
    - npm install
    - npm install vite
    - npm run build
    - composer update
    - composer install --no-interaction --no-dev --prefer-dist
    - touch database/database.sqlite
    - cp .env.example .env
    - php artisan clear-compiled --env=production
    - php artisan optimize --env=production
    - php artisan route:cache
    - php artisan event:cache
    - php artisan key:generate
    - php artisan config:cache
    - php artisan migrate
  cache:
    paths:
      - .env
      - database/database.sqlite
      - node_modules/
      - public/build/
      - storage/
      - vendor/
  only:
    - tags
  except:
    - branches

test:
  stage: test
  dependencies:
    - build
  script:
    - php artisan key:generate
    - php artisan test --log-junit ./junit.xml
  cache:
    paths:
      - .env
      - database/database.sqlite
      - node_modules/
      - public/build/
      - storage/
      - vendor/
  only:
    - tags
  except:
    - branches
  artifacts:
    when: always
    paths:
      - junit.xml
    reports:
      junit: junit.xml

