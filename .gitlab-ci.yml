deploy_staging:
  stage: deploy
  needs:
    - build
    - test
  script:
    - composer global require --prefer-dist laravel/envoy=~2.9.0 --no-interaction --prefer-dist --quiet
    # Add the private SSH key to the build environment
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/gitlab
    - chmod 600 ~/.ssh/gitlab
    - ssh-add ~/.ssh/gitlab
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    # Temporary SSH test
    - ssh -T les99cou@tien-lon.krystal.uk -p 722
    - ssh -T git@gitlab.com
    # Run Envoy
    - envoy run deploy --branch=main --domain=laravel.blakey.family
    # Kill the ssh-agent
    - eval $(ssh-agent -k)
  only:
    - tags
  except:
    - branches

deploy_main:
  stage: deploy
  needs:
    - build
    - test
  script:
    - composer global require --prefer-dist laravel/envoy=~2.9.0 --no-interaction --prefer-dist --quiet
    # Add the private SSH key to the build environment
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/gitlab
    - chmod 600 ~/.ssh/gitlab
    - ssh-add ~/.ssh/gitlab
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    # Temporary SSH test
    - ssh -T les99cou@tien-lon.krystal.uk -p 722
    - ssh -T git@gitlab.com
    # Run Envoy
    - envoy run deploy --branch=main --domain=adam.blakey.family
    # Kill the ssh-agent
    - eval $(ssh-agent -k)
  only:
    - tags
  except:
    - branches
